services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: senai
      POSTGRES_PASSWORD: senai
      POSTGRES_DB: manutencao
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U senai"]
      interval: 5s
      retries: 10

  # Ollama local (modo offline / fallback do modo online sem OPENAI_API_KEY).
  #
  # ATENCAO — GPU no Docker Desktop (Windows/WSL2): o bloco `deploy:` abaixo
  # reserva uma GPU NVIDIA via nvidia-container-toolkit. Se a maquina nao
  # tiver esse toolkit configurado, `docker compose up` falha ao subir o
  # servico ollama. Duas saidas:
  #   1) Remover o bloco `deploy:` inteiro e rodar o Ollama em CPU dentro do
  #      container (mais lento, porem funcional).
  #   2) Usar o Ollama nativo do Windows (fora do Docker) e apontar a API
  #      para ele via OLLAMA_BASE_URL=http://host.docker.internal:11434 no
  #      servico `api` abaixo — nesse caso, remova o servico `ollama` deste
  #      compose (ou apenas nao o inicie).
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    build: {context: ., dockerfile: Dockerfile.api}
    environment:
      DATABASE_URL: postgresql+psycopg://senai:senai@postgres:5432/manutencao
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODE: ${LLM_MODE:-offline}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}

  dashboard:
    build: {context: ., dockerfile: Dockerfile.dashboard}
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  pgdata:
  ollama:
