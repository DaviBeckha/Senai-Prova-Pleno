# Portas publicadas apenas em 127.0.0.1: o stack é de uso local (demonstração).
# Para expor a outro host, troque o bind e proteja os serviços antes (ver
# README, seção "Postura de segurança do protótipo").
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-senai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-senai}
      POSTGRES_DB: ${POSTGRES_DB:-manutencao}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-senai}"]
      interval: 5s
      retries: 10

  # Ollama local (modo offline / fallback do modo online sem OPENAI_API_KEY).
  #
  # CPU e o modo padrao oficial deste compose: sobe em qualquer maquina, sem
  # dependencia de driver ou toolkit de GPU (mais lento, porem funcional e
  # universal). Duas alternativas para acelerar:
  #   1) GPU NVIDIA via override opt-in: docker compose -f docker-compose.yml
  #      -f docker-compose.gpu.yml up --build (requer nvidia-container-toolkit
  #      configurado no Docker).
  #   2) Ollama nativo do Windows (fora do Docker), apontando a API para ele
  #      via OLLAMA_BASE_URL=http://host.docker.internal:11434 no servico
  #      `api` abaixo — nesse caso, remova o servico `ollama` deste compose
  #      (ou apenas nao o inicie).
  ollama:
    image: ollama/ollama:latest
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama:/root/.ollama]

  api:
    build: {context: ., dockerfile: Dockerfile.api}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-senai}:${POSTGRES_PASSWORD:-senai}@postgres:5432/${POSTGRES_DB:-manutencao}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-300}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      LLM_MODE: ${LLM_MODE:-offline}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      UPLOADS_DIR: /srv/data_uploads
    ports: ["127.0.0.1:8000:8000"]
    volumes: [uploads:/srv/data_uploads]
    depends_on:
      postgres: {condition: service_healthy}

  dashboard:
    build: {context: ., dockerfile: Dockerfile.dashboard}
    environment:
      API_URL: http://api:8000
    ports: ["127.0.0.1:8501:8501"]
    depends_on: [api]

volumes:
  pgdata:
  ollama:
  uploads:
