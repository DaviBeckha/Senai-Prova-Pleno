name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # requirements-ci.txt e um subconjunto de requirements.txt sem
      # sentence-transformers/torch/faiss-cpu (~2 GB): nenhum teste carrega o
      # modelo de embeddings real, e app/rag/index.py cai para um fallback em
      # numpy puro sem faiss. Ja inclui pytest — ver comentario no arquivo.
      - run: pip install -r requirements-ci.txt

      - run: python -m pytest -q
